<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Soraia Barroso, indie hacker and founder of MiroMiro">
<style>
text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace}
.lid{fill:#5eead4;font-size:11px;opacity:.95}
.scl{fill:#2b6b74;font-size:11px}
.ray{fill:#2a8f88;font-size:11px;animation:twinkle 3.2s ease-in-out infinite}
.iris{fill:#5eead4;font-size:11px}
.lbl{fill:#5eead4;font-size:10px;letter-spacing:1.5px;opacity:.75}
.h{fill:#4ade80;font-size:12px;letter-spacing:1.6px}
.k{fill:#5b6b80;font-size:13px}
.v{fill:#e6edf6;font-size:14px}
.title{fill:#8aa0b8;font-size:11.5px}
@keyframes reveal{from{transform:translateX(0)}to{transform:translateX(calc(var(--w) + 60px))}}
@keyframes blink{0%,44%,50%,100%{transform:scaleY(1)}47%{transform:scaleY(.06)}}
@keyframes look{0%,18%{transform:translateX(0)}24%,40%{transform:translateX(-46px)}46%,62%{transform:translateX(38px)}68%,84%{transform:translate(0,4px)}90%,100%{transform:translateX(0)}}
@keyframes scan{0%{transform:translateY(0);opacity:0}8%{opacity:.55}92%{opacity:.55}100%{transform:translateY(300px);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes glow{0%,100%{stroke-opacity:.55}50%{stroke-opacity:1}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 6s ease-in-out infinite}
.pupil{animation:look 9s cubic-bezier(.6,0,.3,1) infinite}
.scanline{animation:scan 4.5s linear infinite}
.live{animation:pulse 1.6s ease-in-out infinite}
.caret{animation:caret 1s step-end infinite 5.80s;opacity:0}
.frame{animation:glow 4s ease-in-out infinite}
</style>
